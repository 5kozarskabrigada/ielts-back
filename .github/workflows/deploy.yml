name: Deploy Backend

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: JWT_SECRET,DATABASE_URL,EMAIL_HOST,EMAIL_PORT,EMAIL_USER,EMAIL_PASSWORD
          script: |
            set -e
            
            # Clone repo if it doesn't exist, otherwise pull
            if [ ! -d "/root/ielts-back" ]; then
              cd /root
              git clone https://github.com/5kozarskabrigada/ielts-back.git
            fi
            
            cd /root/ielts-back
            git pull origin master || git pull origin main

            # Create .env file from GitHub Secrets
            echo "Creating .env file from GitHub Secrets..."
            echo "# Generated from GitHub Secrets - $(date)" > .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "DATABASE_URL=${DATABASE_URL}" >> .env
            echo "PORT=4000" >> .env
            echo "FRONTEND_URL=https://toeflpractice.com" >> .env
            echo "BACKEND_URL=https://api.toeflpractice.com" >> .env
            echo "" >> .env
            echo "# Email Configuration" >> .env
            echo "EMAIL_HOST=${EMAIL_HOST}" >> .env
            echo "EMAIL_PORT=${EMAIL_PORT}" >> .env
            echo "EMAIL_USER=${EMAIL_USER}" >> .env
            echo "EMAIL_PASSWORD=${EMAIL_PASSWORD}" >> .env
            echo "EMAIL_SECURE=false" >> .env
            echo "PLATFORM_NAME=TOEFL Practice Platform" >> .env
            echo "✅ .env file created successfully"

            docker compose down
            docker compose up -d --build
            docker compose ps

            echo "Waiting for backend health endpoint..."
            attempt=1
            max_attempts=20
            until curl -fsS http://localhost:4000/api/health >/dev/null; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Backend health check failed after ${max_attempts} attempts"
                docker compose logs --tail=120
                exit 1
              fi
              echo "Health check attempt ${attempt}/${max_attempts} failed; retrying in 3s..."
              attempt=$((attempt + 1))
              sleep 3
            done

            echo "Backend health check passed"
